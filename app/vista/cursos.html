<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if mis_cursos %}Mis cursos{% else %}Cursos{% endif %} - Capacitaciones +</title>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --azul: #1B2D6B;
            --azul-oscuro: #14214F;
            --amarillo: #F5C518;
            --amarillo-hover: #E3B50E;
            --fondo: #EEF4FD;
            --texto: #1B2A5E;
            --texto-suave: #6B7A99;
            --verde: #1FA38A;
            --coral: #EF5B45;
            --borde: #DCE5F5;
        }

        body { font-family: "Outfit", system-ui, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
        h1, h2 { font-family: "Fraunces", Georgia, serif; color: var(--azul); font-weight: 700; }

        .barra-navegacion { background: var(--azul); padding: .7rem 0; }
        .marca-logo { background: var(--amarillo); color: var(--azul); font-weight: 700; padding: .45rem 1.1rem; border-radius: .5rem; }
        .barra-navegacion .nav-link { color: #fff; padding: .5rem .9rem; border-bottom: 2px solid transparent; }
        .barra-navegacion .nav-link:hover { color: var(--amarillo); }
        .barra-navegacion .nav-link.activo { color: var(--amarillo); border-bottom-color: var(--amarillo); font-weight: 600; }
        .btn-sesion { background: var(--amarillo); color: var(--azul); font-weight: 600; }
        .btn-sesion:hover { background: var(--amarillo-hover); color: var(--azul); }

        .hero { background: linear-gradient(120deg, var(--azul-oscuro), var(--azul)); padding: 2.8rem 0 5rem; }
        .hero h1 { color: #fff; font-size: clamp(1.9rem, 4vw, 2.8rem); margin: 0; }

        .filtros { margin-top: -2.8rem; background: #fff; border-radius: 1rem; padding: 1rem; box-shadow: 0 10px 30px rgba(27,45,107,.14); }
        .filtros .form-control, .filtros .form-select { border-color: var(--borde); border-radius: .7rem; padding: .6rem .9rem; }
        .filtros .form-control:focus, .filtros .form-select:focus { border-color: var(--azul); box-shadow: 0 0 0 .2rem rgba(27,45,107,.12); }

        .btn-amarillo { background: var(--amarillo); color: var(--azul); font-weight: 600; border: 0; border-radius: .7rem; }
        .btn-amarillo:hover { background: var(--amarillo-hover); color: var(--azul); }
        .btn-contorno { border: 1.5px solid var(--borde); color: var(--azul); font-weight: 500; border-radius: .7rem; background: #fff; }
        .btn-contorno:hover { border-color: var(--azul); background: var(--azul); color: #fff; }

        .limpiar { font-size: .9rem; font-weight: 600; color: var(--coral); text-decoration: none; }
        .limpiar:hover { text-decoration: underline; }

        .curso { position: relative; background: #fff; border: 1px solid var(--borde); border-radius: 1rem; overflow: hidden; height: 100%; display: flex; flex-direction: column; transition: transform .2s ease, box-shadow .2s ease; }
        .curso:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(27,45,107,.14); }
        .curso-media { position: relative; height: 160px; background: linear-gradient(135deg, var(--azul), #3550B8); }
        .curso-media img { width: 100%; height: 100%; object-fit: cover; }
        .categoria { position: absolute; left: .8rem; top: .8rem; background: #fff; color: var(--azul); font-size: .75rem; font-weight: 600; padding: .25rem .7rem; border-radius: 999px; }
        .curso-cuerpo { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }
        .nivel { font-size: .8rem; font-weight: 600; color: var(--texto-suave); margin-bottom: .4rem; }
